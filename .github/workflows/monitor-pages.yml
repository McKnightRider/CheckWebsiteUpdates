name: Monitor website and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'site/**'
      - 'site_data/**'

concurrency:
  group: monitor-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor check and build Pages site
        env:
          START_URL: https://www.cdsdeterminationscommittees.org
          STATE_PATH: site_data/monitor_state.json
          HISTORY_PATH: site_data/history.json
          SITE_OUTPUT_DIR: site
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_USE_TLS: ${{ secrets.EMAIL_USE_TLS }}
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        run: |
          mkdir -p site_data site
          python monitor.py
          if [ ! -d site/website ]; then
            echo "Expected generated site/website directory was not created"
            exit 1
          fi
          mkdir -p website
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          manifest_name = "asset-manifest.json"
          source_dir = Path("site/website")
          target_dir = Path("website")
          source_manifest = source_dir / manifest_name
          if not source_manifest.is_file():
              raise SystemExit(f"Expected generated manifest {source_manifest} was not created")

          current_files = set(json.loads(source_manifest.read_text(encoding="utf-8")))
          previous_manifest = target_dir / manifest_name
          previous_files = set()
          if previous_manifest.is_file():
              previous_files = set(json.loads(previous_manifest.read_text(encoding="utf-8")))

          for relative_path in sorted(previous_files - current_files):
              candidate = target_dir / relative_path
              if candidate.is_file() or candidate.is_symlink():
                  candidate.unlink()
                  parent = candidate.parent
                  while parent != target_dir and parent.exists() and not any(parent.iterdir()):
                      parent.rmdir()
                      parent = parent.parent

          for relative_path in sorted(current_files | {manifest_name}):
              source_path = source_dir / relative_path
              destination_path = target_dir / relative_path
              destination_path.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source_path, destination_path)
          PY

      - name: Commit updated monitor history and website assets
        run: |
          if [ -z "$(git status --porcelain -- site_data website)" ]; then
            echo "No persisted monitor data or website changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site_data website
          git commit -m "Update monitor history and website [skip ci]"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
